name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选私有签名：在仓库 Settings → Secrets and variables → Actions 中配置
    # KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD。
    # 未配置时使用仓库内公开的 app/motioncue.keystore（任何人都能用它签名，仅为方便覆盖升级）。
    # 这些 Secrets 只传给需要它们的两个步骤，不暴露给其它步骤。
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Use private signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using private signing key"
          else
            echo "No KEYSTORE_BASE64 secret: using the public key committed in the repo"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MotionCue-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MotionCue-apk
          path: out/*.apk

      - name: Publish release (download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 runner 自带的 gh CLI 发布，不引入第三方 Action；分支名等只通过环境变量使用，避免脚本注入
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          {
            echo "分支 \`${GITHUB_REF_NAME}\` 自动构建（${GITHUB_SHA}）。"
            echo
            echo "手机浏览器下载下面的 APK 直接安装即可；签名固定，后续版本可直接覆盖安装。"
          } > notes.md
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "乘车动态提示 $TAG" \
            --notes-file notes.md \
            --prerelease
