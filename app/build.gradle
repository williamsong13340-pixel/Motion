plugins {
    id 'com.android.application'
}

android {
    namespace 'com.motioncue.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.motioncue.app'
        minSdk 26
        targetSdk 35
        // CI 传入 run number，保证每次构建版本号递增、可以覆盖安装
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '0')
    }

    signingConfigs {
        // 默认使用仓库内公开的固定签名：每次 CI 构建签名一致，可直接覆盖升级，但任何人都能用它签名。
        // 私有签名：设置环境变量 KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD；
        // CI 中只需在仓库 Secrets 配置 KEYSTORE_BASE64（keystore 的 base64）和这三个密码/别名，工作流会自动解码使用。
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'motioncue.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'motioncue'
            keyAlias System.getenv('KEY_ALIAS') ?: 'motioncue'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'motioncue'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
